map $http_user_agent $is_ai_bot {
	default    0;       # allow everything by default
        ~*Bytespider         1;
	~*bot      1;
	~*gpt      1;
	~*tool     1;
	~*chat     1;
	~*ai       1;
	~*claude   1;
	~*security 1;
	~*cros     1;
	~*mac      1;
	~*applebot 1;
	~*google   1;
	~*meta     1;
}

map $http_referer $is_bad_referer {
    	default                       0;
    	~*^https?://(www\.)?aocr\.org 1;
	~*facebook                    1;
	~google                       1;
}
